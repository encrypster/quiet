/* ---- Touch: the small things on the page that respond. Sample data only; nothing is sent. ---- */
const Touch = (() => {
  const $ = id => document.getElementById(id);
  const w = () => T[LANG].w;
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dur = min => min >= 60 ? fill(w().h, { h: Math.floor(min / 60), m: min % 60 }) : fill(w().m, { m: min });
  const clock = min => String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");

  // Screen time
  const TIME = [
    { vals: [52, 41, 24, 18, 6], labels: () => ["Telegram", "YouTube", "Instagram", "Chrome", T[LANG].d.apps.maps] },
    { vals: [134, 171, 122, 160, 205, 248, 190], labels: () => w().days },
    { vals: [212, 205, 188, 176, 160, 151, 139, 128], labels: () => [1, 2, 3, 4, 5, 6, 7, 8].map(n => fill(w().week, { n })) }
  ];
  let tab = 1, bar = -1;
  function time() {
    const set = TIME[tab], labels = set.labels(), max = Math.max(...set.vals);
    $("time-seg").innerHTML = w().seg.map((s, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === tab) + '">' + esc(s) + "</button>").join("");
    $("time-bars").innerHTML = set.vals.map((v, i) =>
      '<button type="button" data-i="' + i + '" class="' + (i === bar ? "on" : "") + '" style="--h:' + Math.round(v / max * 100) + '%"><i></i><span>' + esc(String(labels[i])) + "</span></button>").join("");
    const name = tab === 2 && bar >= 0 ? fill(w().weekLong, { n: bar + 1 }) : labels[bar];
    $("time-read").textContent = bar < 0 ? fill(w().total, { t: dur(tab === 2 ? set.vals[7] : set.vals.reduce((a, b) => a + b, 0)) }) : name + ": " + dur(set.vals[bar]);
  }

  // Held notifications
  let held = 0, popped = [], tick = 0;
  function hold() {
    const box = $("hold-box");
    if ($("hold-on").checked) box.innerHTML = '<div class="hold-count"><b>' + held + "</b><span>" + esc(w().holdCount) + "</span></div>";
    else box.innerHTML = popped.map(t => '<div class="hold-chip">' + esc(t) + "</div>").join("");
  }
  function arrive() {
    const names = w().holdNames;
    if ($("hold-on").checked) { held++; hold(); }
    else { popped = [names[tick % names.length]].concat(popped).slice(0, 3); hold(); }
    tick++;
  }

  // Schedule
  function sched() {
    const min = Number($("sched").value), shut = min >= 23 * 60 || min < 7 * 60;
    $("sched-read").textContent = fill(shut ? w().closed : w().open, { t: clock(min) });
  }

  // Strict session
  let left = 25 * 60, refused = false;
  const mmss = () => String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  function strict() { $("strict-time").textContent = mmss(); if (refused) $("strict-read").textContent = fill(w().strictNo, { t: mmss() }); }

  // What a name is made of, the way the app looks at it.
  const PARTS = ["porn", "порн", "xvideos", "xnxx", "xhamster", "onlyfans", "hentai", "хентай", "nsfw", "erotic", "erotik", "эротик", "секс", "интим", "18+", "+18", "🔞", "sekis", "секис", "seksual"];
  const WORDS = ["sex", "sexy", "seks", "seksi", "xxx", "nude", "anal"];
  function guard(replay) {
    const raw = $("guard-in").value.trim(), text = raw.toLowerCase();
    const out = $("guard-out"), phone = document.querySelector("#parents .phone");
    $("guard-name").textContent = raw ? "‹  " + raw : "";
    if (!raw) { out.innerHTML = ""; phone.classList.remove("pass"); return; }
    const bad = PARTS.some(p => text.includes(p)) || text.split(/[^\p{L}\p{N}+]+/u).some(x => WORDS.includes(x));
    const v = bad ? w().gClose : w().gPass;
    out.innerHTML = "<b>" + esc(v[0]) + "</b>" + esc(v[1]);
    phone.classList.toggle("pass", !bad);
    if (replay && phone.classList.contains("anim")) { phone.classList.remove("play"); void phone.offsetWidth; phone.classList.add("play"); }
  }

  // Which plan
  const picked = new Set();
  function needs() {
    $("needs").innerHTML = w().needs.map((n, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + picked.has(i) + '">' + esc(n[0]) + "</button>").join("");
    const pro = [...picked].some(i => w().needs[i][1]);
    $("need-out").textContent = !picked.size ? w().needNone : pro ? w().needPro : w().needFree;
    $("plans").className = !picked.size ? "" : pro ? "pick-pro" : "pick-free";
  }

  // What each access is for
  let perm = 0;
  function perms() {
    $("perm-tabs").innerHTML = w().perms.map((p, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === perm) + '">' + esc(p[0]) + "</button>").join("");
    $("perm-text").textContent = w().perms[perm][1];
  }

  // The ring at the end: a slow breath to follow.
  let breathing = null, phase = 0;
  function ringCap() { $("ring-cap").textContent = breathing === null ? w().ring : (phase % 2 ? w().breatheOut : w().breatheIn); }

  // The year: plain arithmetic on the visitor's own numbers.
  function year() {
    const dots = $("y-dots");
    if (!dots.children.length) dots.innerHTML = Array.from({ length: 365 }, (_, i) => '<i style="--n:' + i + '"></i>').join("");
    const min = Number($("y-h").value), cut = Math.min(Number($("y-c").value), min);
    const days = Math.round(min * 365 / 1440), back = Math.round(cut * 365 / 1440);
    $("y-days").textContent = days;
    $("y-ho").textContent = dur(min); $("y-co").textContent = dur(cut);
    $("y-line1").textContent = fill(w().yPct, { p: Math.round(min / 960 * 100) });
    $("y-line2").textContent = back > 0 ? fill(w().ySave, { c: dur(cut), d: back }) : w().yNone;
    [...dots.children].forEach((el, i) => { el.className = i < days - back ? "t" : i < days ? "s" : ""; });
  }

  function on(id, type, fn) { $(id).addEventListener(type, fn); }
  function pick(id, fn) { on(id, "click", e => { const b = e.target.closest("[data-i]"); if (b) fn(Number(b.dataset.i)); }); }

  function init() {
    pick("time-seg", i => { tab = i; bar = -1; time(); });
    pick("time-bars", i => { bar = bar === i ? -1 : i; time(); });
    on("hold-on", "change", () => { if ($("hold-on").checked) popped = []; hold(); });
    setInterval(arrive, 1900);
    on("sched", "input", sched);
    setInterval(() => { left = left > 0 ? left - 1 : 25 * 60; strict(); }, 1000);
    on("strict-end", "click", () => {
      refused = true; strict();
      const t = $("strict-time"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
    });
    on("y-h", "input", year); on("y-c", "input", year);
    on("gray-on", "change", () => $("feed").classList.toggle("gray", $("gray-on").checked));
    on("guard-in", "input", () => guard(true));
    on("guard-ex", "click", e => { const b = e.target.closest("button"); if (b) { $("guard-in").value = b.textContent; guard(true); } });
    pick("needs", i => { picked.has(i) ? picked.delete(i) : picked.add(i); needs(); });
    pick("perm-tabs", i => { perm = i; perms(); });
    on("ring", "click", () => {
      const ring = $("ring");
      if (breathing !== null) { clearInterval(breathing); breathing = null; ring.classList.remove("go"); ringCap(); return; }
      phase = 0; ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
      breathing = setInterval(() => { phase++; ringCap(); }, 4000); ringCap();
    });
  }
  function lang() {
    time(); hold(); sched(); strict(); needs(); perms(); ringCap(); year();
    $("guard-in").placeholder = w().gPh;
    $("sched").setAttribute("aria-label", T[LANG].d4_h);
    $("ring").setAttribute("aria-label", w().ring);
    $("guard-ex").innerHTML = w().gEx.map(x => '<button type="button">' + esc(x) + "</button>").join("");
    guard(false);
  }
  return { init, lang };
})();

function pickLang() {
  try { const saved = localStorage.getItem("quiet-lang"); if (saved && T[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "uz").slice(0, 2).toLowerCase();
  return T[nav] ? nav : "uz";
}

function apply(lang) {
  const t = T[lang];
  LANG = lang;
  document.documentElement.lang = lang;
  document.title = t.title;
  // The policy in the same language as the page.
  const policy = "https://encrypster.github.io/quiet-privacy/" + (lang === "en" ? "" : lang + "/");
  document.getElementById("privacy-link").href = policy;
  document.getElementById("privacy-link-foot").href = policy;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("quiet-lang", lang); } catch (e) {}
  Demo.refresh();
  Touch.lang();
  if (ready) FX.lang();
}
