<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet — Android uchun sokin bosh ekran</title>
<meta name="description" content="Quiet bosh ekranni oddiy matnli roʻyxatga aylantiradi va vaqtingizni oladigan ilovalar oldiga kichik toʻsiq qoʻyadi. Android 8 va undan yangi.">
<meta property="og:title" content="Quiet — Android uchun sokin bosh ekran">
<meta property="og:description" content="Matnli bosh ekran, ilova limitlari, fokus va ota-ona qulfi. Roʻyxatdan oʻtish shart emas.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --fg: #fff; --muted: #a0a0a0; --line: #262626; --soft: #0d0d0d;
    --max: 1120px; --gut: 24px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --fg: #0a0a0a; --muted: #5c5c5c; --line: #e4e4e4; --soft: #f5f5f5; }
  }
  /* A band in the opposite colours, for rhythm. */
  .invert { --bg: #fff; --fg: #0a0a0a; --muted: #5c5c5c; --line: #dcdcdc; --soft: #f1f1f1; }
  @media (prefers-color-scheme: light) {
    .invert { --bg: #0a0a0a; --fg: #fff; --muted: #a0a0a0; --line: #2a2a2a; --soft: #151515; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 17px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut); }
  h1, h2, h3 { font-weight: 600; letter-spacing: -.022em; margin: 0; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 19px; text-decoration: none; letter-spacing: -.01em; }
  .logo i { width: 15px; height: 15px; border: 2.5px solid var(--fg); border-radius: 50%; }
  nav { display: flex; align-items: center; gap: 28px; font-size: 15px; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--fg); }
  .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
  .langs button { background: none; border: 0; color: var(--muted); font: 500 12.5px/1 Inter, system-ui, sans-serif; padding: 7px 10px; border-radius: 999px; cursor: pointer; letter-spacing: .04em; }
  .langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  @media (max-width: 820px) { nav a { display: none; } }

  /* Hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 56px; align-items: center; padding-top: 96px; padding-bottom: 88px; }
  .kicker { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  h1 { font-size: clamp(40px, 6.2vw, 72px); line-height: 1.02; letter-spacing: -.035em; margin-bottom: 26px; }
  .lead { font-size: clamp(18px, 2vw, 21px); line-height: 1.5; color: var(--muted); max-width: 36em; margin-bottom: 36px; }
  .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
  .status { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; font-size: 15.5px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }
  .more { font-weight: 500; font-size: 15.5px; }
  .hero-phone { display: flex; justify-content: center; }
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 48px; padding-top: 56px; padding-bottom: 56px; }
  }

  .facts { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .facts ul { list-style: none; margin: 0; padding: 18px 0; display: flex; flex-wrap: wrap; gap: 8px 40px; color: var(--muted); font-size: 15px; }
  .facts li { display: flex; align-items: center; gap: 10px; }
  .facts li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }

  /* The app's screens, drawn the way the app draws them: black, white, text. */
  .phone {
    width: 264px; aspect-ratio: 9 / 19; flex: none; position: relative; overflow: hidden;
    background: #000; color: #fff; border: 1px solid #2c2c2c; border-radius: 38px;
    box-shadow: 0 0 0 6px #0b0b0b, 0 0 0 7px #2c2c2c;
    padding: 46px 24px 26px; display: flex; flex-direction: column; font-size: 13px; line-height: 1.4;
  }
  .phone .sb { position: absolute; top: 16px; left: 26px; right: 26px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; }
  .phone .sb span:last-child { display: flex; gap: 4px; align-items: center; }
  .phone .sb b { width: 16px; height: 8px; border-radius: 3px; background: #fff; display: block; }
  .phone .sb em { width: 9px; height: 8px; border-radius: 2px; background: #fff; display: block; }
  .ph-time { font-size: 52px; font-weight: 400; letter-spacing: -.035em; line-height: 1; margin-top: 22px; }
  .ph-dim { color: #8e8e8e; }
  .ph-date { margin-top: 10px; }
  .ph-pill { align-self: flex-start; margin-top: 16px; border: 1px solid #5a5a5a; border-radius: 12px; padding: 7px 12px; font-weight: 500; }
  .ph-apps { margin-top: auto; display: grid; gap: 15px; font-size: 20px; padding-bottom: 34px; }
  .ph-title { font-size: 23px; font-weight: 600; letter-spacing: -.02em; margin-top: auto; }
  .ph-btns { display: grid; gap: 9px; margin-top: 22px; padding-bottom: 34px; }
  .ph-btn { border: 1px solid #3a3a3a; color: #777; border-radius: 13px; text-align: center; padding: 10px 6px; font-weight: 500; }
  .ph-btn.on { background: #fff; color: #000; border-color: #fff; }
  .ph-chat { display: grid; gap: 16px; margin-top: 10px; }
  .ph-chat div { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
  .ph-chat i { width: 30px; height: 30px; border-radius: 50%; background: #1d1d1d; }
  .ph-chat u { display: block; height: 8px; border-radius: 4px; background: #1d1d1d; margin: 4px 0; text-decoration: none; }
  .ph-toast { margin-top: auto; margin-bottom: 20px; border: 1px solid #4a4a4a; background: #0c0c0c; border-radius: 14px; padding: 12px 14px; font-weight: 500; }
  .ph-home { position: absolute; bottom: 10px; left: 50%; width: 84px; height: 4px; margin-left: -42px; border-radius: 4px; background: #fff; opacity: .9; }

  /* The demo: a small Quiet that runs in the page. */
  .try { background: var(--soft); border-bottom: 1px solid var(--line); }
  .try-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "phone head" "phone side"; column-gap: 72px; row-gap: 28px; align-items: start; }
  .try-head { grid-area: head; align-self: end; }
  .try-head p:last-child { color: var(--muted); font-size: 18px; margin-top: 18px; max-width: 32em; }
  .try-phone { grid-area: phone; display: flex; justify-content: center; }
  .try-side { grid-area: side; }
  @media (max-width: 860px) {
    .try-grid { grid-template-columns: 1fr; grid-template-areas: "head" "phone" "side"; row-gap: 36px; }
  }
  .steps { list-style: none; margin: 0 0 26px; padding: 0; counter-reset: s; max-width: 30em; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 500 13px/1 Inter, system-ui, sans-serif; }
  .steps li.done { color: var(--fg); }
  .steps li.done::before { content: "✓"; background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .try-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { font: 500 15.5px/1 Inter, system-ui, sans-serif; min-height: 46px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; }
  .btn.ghost { background: none; color: var(--fg); border-color: var(--line); }
  .try-done { margin-top: 22px; font-weight: 500; max-width: 30em; }

  .phone.demo { width: 300px; max-width: 100%; padding: 0; font-size: 14px; user-select: none; touch-action: pan-y; }
  .demo button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
  .demo button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .demo .scr { position: absolute; inset: 0; padding: 48px 24px 44px; display: flex; flex-direction: column; animation: d-in .22s ease-out; }
  @keyframes d-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .demo .scr { animation: none; } }
  .demo .d-time { font-size: 56px; letter-spacing: -.035em; line-height: 1; margin-top: 22px; }
  .demo .d-dim { color: #8e8e8e; }
  .demo .d-pill { align-self: flex-start; margin-top: 14px; border: 1px solid #5a5a5a; border-radius: 12px; padding: 7px 12px; font-weight: 500; }
  .demo .d-list { margin-top: auto; display: grid; gap: 4px; }
  .demo .d-app { font-size: 21px; padding: 7px 0; width: 100%; }
  .demo .d-app:active { opacity: .5; }
  .demo .d-all { margin-top: 14px; color: #8e8e8e; padding: 8px 0; }
  .demo .d-search { width: 100%; background: none; border: 1px solid #3a3a3a; border-radius: 12px; color: #fff; font: inherit; padding: 10px 12px; margin: 6px 0 10px; }
  .demo .d-search::placeholder { color: #777; }
  .demo .d-scroll { overflow-y: auto; flex: 1; scrollbar-width: none; }
  .demo .d-title { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .demo .d-btn { display: block; width: 100%; border: 1px solid #fff; border-radius: 13px; text-align: center; padding: 11px 8px; font-weight: 500; margin-top: 9px; }
  .demo .d-btn.fill { background: #fff; color: #000; }
  .demo .d-btn[disabled] { border-color: #333; color: #555; cursor: default; }
  .demo .d-bar { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; padding-bottom: 12px; border-bottom: 1px solid #1f1f1f; }
  .demo .d-back { font-size: 22px; line-height: 1; padding: 2px 6px 4px 0; }
  .demo .d-chip { align-self: flex-start; margin-top: 12px; border: 1px solid #3a3a3a; border-radius: 999px; padding: 5px 11px; font-size: 12px; color: #b5b5b5; }
  .demo .d-sk { display: grid; gap: 14px; margin-top: 16px; }
  .demo .d-sk i { display: block; border-radius: 10px; background: #161616; }
  .demo .d-tabs { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #1f1f1f; }
  .demo .d-tabs button { text-align: center; padding: 12px 0 2px; font-weight: 500; color: #8e8e8e; }
  .demo .d-tabs button.on { color: #fff; }
  .demo .d-chatrow { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; width: 100%; padding: 10px 0; }
  .demo .d-chatrow i { width: 38px; height: 38px; border-radius: 50%; background: #1d1d1d; }
  .demo .d-chatrow b { display: block; font-weight: 500; font-size: 15px; }
  .demo .d-chatrow span span { color: #8e8e8e; font-size: 12.5px; }
  .demo .d-toast { position: absolute; left: 16px; right: 16px; bottom: 46px; border: 1px solid #4a4a4a; background: #0c0c0c; border-radius: 14px; padding: 12px 14px; font-weight: 500; font-size: 13px; animation: d-in .2s ease-out; z-index: 3; }
  .demo .d-homebar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: grid; place-items: center; z-index: 4; }
  .demo .d-homebar i { width: 96px; height: 4px; border-radius: 4px; background: #fff; }

  /* Sections */
  section { padding: 104px 0; }
  .sec-head { max-width: 46em; margin-bottom: 64px; }
  .num { font: 500 13px/1 Inter, system-ui, sans-serif; letter-spacing: .08em; color: var(--muted); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  h2 { font-size: clamp(30px, 4.4vw, 48px); line-height: 1.08; letter-spacing: -.03em; }
  .sec-head p { color: var(--muted); font-size: 19px; line-height: 1.55; margin-top: 20px; }
  @media (max-width: 700px) { section { padding: 72px 0; } .sec-head { margin-bottom: 44px; } }

  .rows { display: grid; gap: 96px; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center; }
  .row .shot { display: flex; justify-content: center; background: var(--soft); border: 1px solid var(--line); border-radius: 28px; padding: 44px 20px; }
  .row:nth-child(even) .shot { order: 2; }
  .row h3 { font-size: clamp(23px, 2.6vw, 30px); line-height: 1.18; margin-bottom: 16px; }
  .row p { color: var(--muted); font-size: 18px; max-width: 30em; }
  @media (max-width: 860px) {
    .rows { gap: 64px; }
    .row { grid-template-columns: 1fr; gap: 28px; }
    .row:nth-child(even) .shot { order: 0; }
  }

  .also { border-top: 1px solid var(--line); }
  .also dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 64px; }
  .also .item { padding: 26px 0; border-bottom: 1px solid var(--line); }
  .also dt { font-weight: 600; font-size: 18px; margin-bottom: 6px; letter-spacing: -.01em; }
  .also dd { margin: 0; color: var(--muted); font-size: 16.5px; }
  @media (max-width: 760px) { .also dl { grid-template-columns: 1fr; } }

  /* Parents */
  .parents { background: var(--bg); color: var(--fg); }
  .parents-top { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 56px; align-items: center; margin-bottom: 72px; }
  .parents-top .sec-head { margin-bottom: 0; }
  .parents-top .shot { display: flex; justify-content: center; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; }
  .cols h3 { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 16px; border-bottom: 1.5px solid var(--fg); }
  .cols ul { list-style: none; margin: 0; padding: 0; }
  .cols li { padding: 20px 0; border-bottom: 1px solid var(--line); font-size: 17px; }
  .cols li b { display: block; font-weight: 600; margin-bottom: 4px; }
  .cols li span { color: var(--muted); }
  @media (max-width: 860px) {
    .parents-top { grid-template-columns: 1fr; gap: 40px; margin-bottom: 48px; }
    .cols { grid-template-columns: 1fr; gap: 40px; }
  }

  /* Pricing */
  table { width: 100%; border-collapse: collapse; font-size: 17px; }
  th, td { text-align: left; padding: 18px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  thead th { font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1.5px solid var(--fg); padding-bottom: 14px; }
  th:nth-child(n+2), td:nth-child(n+2) { width: 150px; padding-left: 16px; }
  td:nth-child(3) { font-weight: 500; }
  td.no { color: var(--muted); }
  .price-note { color: var(--muted); font-size: 16px; margin-top: 26px; max-width: 46em; }
  @media (max-width: 600px) {
    table { font-size: 15.5px; }
    th:nth-child(n+2), td:nth-child(n+2) { width: 84px; padding-left: 10px; }
  }

  /* Privacy */
  .privacy { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 64px; }
  .privacy .body p { font-size: 19px; line-height: 1.6; color: var(--muted); }
  .privacy .body p + p { margin-top: 18px; }
  .privacy .body a { color: var(--fg); font-weight: 500; }
  @media (max-width: 860px) { .privacy { grid-template-columns: 1fr; gap: 28px; } }

  /* FAQ */
  .faq { max-width: 800px; }
  details { border-bottom: 1px solid var(--line); }
  details:first-of-type { border-top: 1px solid var(--line); }
  summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 22px 0; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-weight: 400; font-size: 22px; line-height: 1; color: var(--muted); flex: none; }
  details[open] summary::after { content: "−"; }
  details p { color: var(--muted); padding: 0 40px 24px 0; max-width: 44em; }

  /* Closing and footer */
  .closing { border-top: 1px solid var(--line); text-align: left; }
  .closing h2 { margin-bottom: 18px; }
  .closing p { color: var(--muted); font-size: 19px; max-width: 34em; }
  .closing a { color: var(--fg); font-weight: 500; }
  footer { border-top: 1px solid var(--line); padding: 30px 0 44px; color: var(--muted); font-size: 14.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; }
  footer nav { gap: 24px; font-size: 14.5px; }
  footer nav a { display: inline; }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top"><i></i>Quiet</a>
    <nav aria-label="Main">
      <a href="#how" data-t="nav_how"></a>
      <a href="#parents" data-t="nav_parents"></a>
      <a href="#pricing" data-t="nav_pricing"></a>
      <a href="#faq" data-t="nav_faq"></a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="uz">UZ</button>
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div>
      <p class="kicker" data-t="kicker"></p>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="hero-actions">
        <span class="status"><i></i><span data-t="status"></span></span>
        <a class="more" href="#try" data-t="more"></a>
      </div>
    </div>
    <div class="hero-phone" aria-hidden="true">
      <div class="phone">
        <div class="sb"><span>7:42</span><span><em></em><b></b></span></div>
        <div class="ph-time">7:42</div>
        <div class="ph-dim ph-date" data-t="m_date"></div>
        <div class="ph-dim" data-t="m_today"></div>
        <div class="ph-apps">
          <div data-t="m_a1"></div><div data-t="m_a2"></div><div data-t="m_a3"></div><div data-t="m_a4"></div><div data-t="m_a5"></div>
        </div>
        <div class="ph-home"></div>
      </div>
    </div>
  </div>

  <div class="facts">
    <div class="wrap"><ul>
      <li data-t="fact1"></li><li data-t="fact2"></li><li data-t="fact3"></li>
    </ul></div>
  </div>

  <section id="try" class="try">
    <div class="wrap try-grid">
      <div class="try-head">
        <p class="num" data-t="try_num"></p>
        <h2 data-t="try_h"></h2>
        <p data-t="try_p"></p>
      </div>
      <div class="try-phone">
        <div class="phone demo" id="demo">
          <div class="sb"><span id="demo-clock">7:42</span><span><em></em><b></b></span></div>
          <div id="demo-screen"></div>
          <div id="demo-toast" role="status" aria-live="polite"></div>
          <button class="d-homebar" type="button" data-act="home" id="demo-home"><i></i></button>
        </div>
      </div>
      <div class="try-side">
        <ol class="steps" id="demo-steps"></ol>
        <div class="try-actions">
          <button class="btn" type="button" id="demo-focus"></button>
          <button class="btn ghost" type="button" id="demo-reset"></button>
        </div>
        <p class="try-done" id="demo-done" hidden></p>
      </div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <div class="sec-head">
        <p class="num">01</p>
        <h2 data-t="how_h"></h2>
        <p data-t="how_p"></p>
      </div>
      <div class="rows">
        <div class="row">
          <div class="shot" aria-hidden="true">
            <div class="phone">

/* ---- The demo: a small Quiet in the page. Nothing here leaves the browser. ---- */
const Demo = (() => {
  const HOME = ["phone", "messages", "camera", "instagram", "youtube", "telegram"];
  const FOCUS_HOME = ["mail", "calendar", "docs"];
  const FOCUS_ALLOWED = new Set(["mail", "calendar", "docs", "phone", "notes"]);
  const ALL = ["calendar", "camera", "clock", "docs", "instagram", "mail", "maps", "messages", "notes", "phone", "telegram", "youtube"];
  const WAIT_S = 5, VISIT_S = 8;
  const st = { screen: "home", app: null, focus: false, n: 0, min: 0, chat: -1, done: new Set() };
  let timers = [], toastTimer = null;
  const $ = id => document.getElementById(id);
  const d = () => T[LANG].d;
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const name = app => d().apps[app];
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function clear() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function mark(i) { st.done.add(i); side(); }
  function toast(text) {
    const el = $("demo-toast");
    el.innerHTML = '<div class="d-toast">' + esc(text) + "</div>";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.innerHTML = ""; }, 3200);
  }
  function go(screen, app) { clear(); st.screen = screen; if (app !== undefined) st.app = app; render(); }

  function open(app) {
    if (st.focus && !FOCUS_ALLOWED.has(app)) { go("block", app); if (app === "instagram") mark(2); return; }
    if (app === "instagram") {
      st.n = WAIT_S; go("wait", app); mark(0);
      timers.push(setInterval(() => { if (st.n > 0) { st.n--; render(false); } }, 1000));
      return;
    }
    st.min = 0; go("app", app);
  }
  function visit(min) {
    st.min = min; go("app", "instagram");
    later(() => { go("home"); toast(fill(d().timeup, { app: name("instagram") })); mark(1); }, VISIT_S * 1000);
  }
  function shorts() {
    go("shorts", "youtube");
    later(() => { st.min = 0; go("app", "youtube"); toast(d().shorts_toast); mark(3); }, 900);
  }
  function chat(i) {
    st.chat = i; go("chat", "telegram");
    if (i === 2) later(() => { go("app", "telegram"); toast(d().bot_toast); mark(4); }, 900);
  }

  const skeleton = hs => '<div class="d-sk">' + hs.map(h => '<i style="height:' + h + 'px"></i>').join("") + "</div>";
  const bar = (title, act) => '<div class="d-bar"><button type="button" class="d-back" data-act="' + act + '" aria-label="' + esc(d().back) + '">‹</button>' + esc(title) + "</div>";
  const appBtn = app => '<button type="button" class="d-app" data-act="open:' + app + '">' + esc(name(app)) + "</button>";

  function view() {
    const t = d();
    switch (st.screen) {
      case "home": {
        const list = (st.focus ? FOCUS_HOME : HOME).map(appBtn).join("");
        return '<div class="d-time">' + clock() + '</div><div class="d-dim" style="margin-top:10px">' + esc(today()) + "</div>" +
          (st.focus ? '<div class="d-pill">' + esc(t.pill) + "</div>" : '<div class="d-dim">' + esc(t.today) + "</div>") +
          '<div class="d-list">' + list + '</div><button type="button" class="d-all" data-act="drawer">' + esc(t.all) + " ↑</button>";
      }
      case "drawer":
        return bar(t.all, "home") + '<input class="d-search" id="demo-q" type="search" autocomplete="off" placeholder="' + esc(t.search) + '" aria-label="' + esc(t.search) + '">' +
          '<div class="d-scroll" id="demo-apps">' + drawerList("") + "</div>";
      case "wait": {
        const ready = st.n <= 0;
        return '<div style="margin-top:auto"></div><div class="d-title">' + esc(fill(t.opening, { app: name(st.app) })) + "</div>" +
          '<div class="d-dim" style="margin-top:8px">' + (ready ? "&nbsp;" : esc(fill(t.wait, { n: st.n }))) + '</div><div class="d-dim">' + esc(t.used) + "</div>" +
          '<div style="margin:16px 0 12px">' + esc(t.why) + "</div>" +
          '<button type="button" class="d-btn fill" data-act="home">' + esc(t.go_home) + "</button>" +
          [5, 10, 20].map(m => '<button type="button" class="d-btn" data-act="visit:' + m + '"' + (ready ? "" : " disabled") + ">" + esc(fill(t.cont, { n: m })) + "</button>").join("");
      }
      case "block":
        return '<div style="margin-top:auto"></div><div class="d-title">' + esc(fill(t.block_h, { app: name(st.app) })) + "</div>" +
          '<div class="d-dim" style="margin:10px 0 18px">' + esc(t.block_p) + "</div>" +
          '<button type="button" class="d-btn fill" data-act="home">' + esc(t.go_home) + "</button>";
      case "shorts":
        return bar("Shorts", "open:youtube") + skeleton([330]);
      case "chat":
        return bar(t.chats[st.chat], "open:telegram") + '<div class="d-dim" style="margin-top:8px">' + (st.chat === 2 ? "bot" : "") + "</div>" + skeleton([44, 60, 36]);
      case "app":
        if (st.app === "youtube")
          return bar("YouTube", "home") + skeleton([120, 14, 120, 14]) +
            '<div class="d-tabs"><button type="button" class="on" data-act="open:youtube">' + esc(t.tab_home) + '</button><button type="button" data-act="shorts">Shorts</button></div>';
        if (st.app === "telegram")
          return bar("Telegram", "home") + '<div style="margin-top:8px">' + t.chats.map((c, i) =>
            '<button type="button" class="d-chatrow" data-act="chat:' + i + '"><i></i><span><b>' + esc(c) + "</b><span>" + esc(t.subs[i]) + "</span></span></button>").join("") + "</div>";
        return bar(name(st.app), "home") +
          (st.min ? '<div class="d-chip">' + esc(fill(t.chip, { n: st.min, s: VISIT_S })) + "</div>" : "") +
          skeleton(st.app === "instagram" ? [36, 200, 14, 14] : [60, 40, 90, 40]);
    }
    return "";
  }
  function drawerList(q) {
    q = q.trim().toLowerCase();
    return ALL.map(a => [a, name(a)]).filter(p => p[1].toLowerCase().includes(q)).sort((a, b) => a[1].localeCompare(b[1], LANG))
      .map(p => appBtn(p[0])).join("");
  }
  function clock() { const n = new Date(); return n.getHours() + ":" + String(n.getMinutes()).padStart(2, "0"); }
  function today() {
    // Written out by hand: many browsers have no Uzbek calendar and print "M11 19, Thu".
    const n = new Date(), day = n.getDate();
    const W = {
      uz: ["Yakshanba", "Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba"],
      ru: ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"],
      en: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
    }[LANG][n.getDay()];
    const M = {
      uz: ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"],
      ru: ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"],
      en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
    }[LANG][n.getMonth()];
    return LANG === "uz" ? W + ", " + day + "-" + M : W + ", " + day + " " + M;
  }
  function render(animate) {
    const el = $("demo-screen");
    if (!el) return;
    el.innerHTML = '<div class="scr"' + (animate === false ? ' style="animation:none"' : "") + ">" + view() + "</div>";
    $("demo-clock").textContent = clock();
    $("demo-home").setAttribute("aria-label", d().home_btn);
  }
  function side() {
    const t = d();
    $("demo-steps").innerHTML = t.steps.map((s, i) => "<li" + (st.done.has(i) ? ' class="done"' : "") + "><span>" + esc(s) + "</span></li>").join("");
    $("demo-focus").textContent = st.focus ? t.focus_off : t.focus_on;
    $("demo-reset").textContent = t.reset;
    const done = $("demo-done");
    done.textContent = t.done;
    done.hidden = st.done.size < t.steps.length;
  }
  function act(a) {
    const [what, arg] = a.split(":");
    if (what === "home") go("home");
    else if (what === "drawer") go("drawer");
    else if (what === "open") open(arg);
    else if (what === "visit") visit(Number(arg));
    else if (what === "shorts") shorts();
    else if (what === "chat") chat(Number(arg));
  }
  function init() {
    const phone = $("demo");
    phone.addEventListener("click", e => {
      const b = e.target.closest("[data-act]");
      if (b && !b.disabled) act(b.dataset.act);
    });
    phone.addEventListener("input", e => {
      if (e.target.id === "demo-q") $("demo-apps").innerHTML = drawerList(e.target.value);
    });
    // Swipe up on the home screen opens the app list, as in the app.
    let y0 = null;
    phone.addEventListener("pointerdown", e => { y0 = e.clientY; });
    phone.addEventListener("pointerup", e => { if (y0 !== null && st.screen === "home" && y0 - e.clientY > 50) go("drawer"); y0 = null; });
    $("demo-focus").addEventListener("click", () => { st.focus = !st.focus; go("home"); side(); });
    $("demo-reset").addEventListener("click", () => { st.focus = false; st.done.clear(); $("demo-toast").innerHTML = ""; go("home"); side(); });
    setInterval(() => { if (st.screen === "home") render(false); }, 20000);
  }
  return { init, refresh() { render(false); side(); } };
})();

function pickLang() {
  try { const saved = localStorage.getItem("quiet-lang"); if (saved && T[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "uz").slice(0, 2).toLowerCase();
  return T[nav] ? nav : "uz";
}

function apply(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  // The policy in the same language as the page.
  const policy = "https://encrypster.github.io/quiet-privacy/" + (lang === "en" ? "" : lang + "/");
  document.getElementById("privacy-link").href = policy;
  document.getElementById("privacy-link-foot").href = policy;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("quiet-lang", lang); } catch (e) {}
  LANG = lang;
  Demo.refresh();
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => apply(b.dataset.lang)));
Demo.init();
apply(pickLang());
</script>
</body>
</html>
