<html lang="uz">
<head>

<meta property="og:title" content="Quiet — Android uchun sokin bosh ekran">

<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<script>try { var th = localStorage.getItem("quiet-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --fg: #fff; --muted: #a0a0a0; --line: #262626; --soft: #0d0d0d;
    --max: 1120px; --gut: 24px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fff; --fg: #0a0a0a; --muted: #5c5c5c; --line: #e4e4e4; --soft: #f5f5f5; }
  }
  /* A band in the opposite colours, for rhythm. */
  .invert { --bg: #fff; --fg: #0a0a0a; --muted: #5c5c5c; --line: #dcdcdc; --soft: #f1f1f1; }
  @media (prefers-color-scheme: light) {
    .invert { --bg: #0a0a0a; --fg: #fff; --muted: #a0a0a0; --line: #2a2a2a; --soft: #151515; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 17px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut); }
  h1, h2, h3 { font-weight: 600; letter-spacing: -.022em; margin: 0; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 19px; text-decoration: none; letter-spacing: -.01em; }
  .logo i { width: 15px; height: 15px; border: 2.5px solid var(--fg); border-radius: 50%; }
  nav { display: flex; align-items: center; gap: 28px; font-size: 15px; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--fg); }
  .langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
  .langs button { background: none; border: 0; color: var(--muted); font: 500 12.5px/1 Inter, system-ui, sans-serif; padding: 7px 10px; border-radius: 999px; cursor: pointer; letter-spacing: .04em; }
  .langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  @media (max-width: 820px) { nav a { display: none; } }

  /* Hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 56px; align-items: center; padding-top: 96px; padding-bottom: 88px; }
  .kicker { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  h1 { font-size: clamp(40px, 6.2vw, 72px); line-height: 1.02; letter-spacing: -.035em; margin-bottom: 26px; }
  .lead { font-size: clamp(18px, 2vw, 21px); line-height: 1.5; color: var(--muted); max-width: 36em; margin-bottom: 36px; }
  .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
  .status { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; font-size: 15.5px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }
  .more { font-weight: 500; font-size: 15.5px; }
  .hero-phone { display: flex; justify-content: center; }
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 48px; padding-top: 56px; padding-bottom: 56px; }
  }

  .facts { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .facts ul { list-style: none; margin: 0; padding: 18px 0; display: flex; flex-wrap: wrap; gap: 8px 40px; color: var(--muted); font-size: 15px; }
  .facts li { display: flex; align-items: center; gap: 10px; }
  .facts li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }

  /* The app's screens, drawn the way the app draws them: black, white, text. */
  .phone {
    width: 264px; aspect-ratio: 9 / 19; flex: none; position: relative; overflow: hidden;
    background: #000; color: #fff; border: 1px solid #2c2c2c; border-radius: 38px;
    box-shadow: 0 0 0 6px #0b0b0b, 0 0 0 7px #2c2c2c;
    padding: 46px 24px 26px; display: flex; flex-direction: column; font-size: 13px; line-height: 1.4;
  }
  .phone .sb { position: absolute; top: 16px; left: 26px; right: 26px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; }
  .phone .sb span:last-child { display: flex; gap: 4px; align-items: center; }
  .phone .sb b { width: 16px; height: 8px; border-radius: 3px; background: #fff; display: block; }
  .phone .sb em { width: 9px; height: 8px; border-radius: 2px; background: #fff; display: block; }
  .ph-time { font-size: 52px; font-weight: 400; letter-spacing: -.035em; line-height: 1; margin-top: 22px; }
  .ph-dim { color: #8e8e8e; }
  .ph-date { margin-top: 10px; }
  .ph-pill { align-self: flex-start; margin-top: 16px; border: 1px solid #5a5a5a; border-radius: 12px; padding: 7px 12px; font-weight: 500; }
  .ph-apps { margin-top: auto; display: grid; gap: 15px; font-size: 20px; padding-bottom: 34px; }
  .ph-title { font-size: 23px; font-weight: 600; letter-spacing: -.02em; margin-top: auto; }
  .ph-btns { display: grid; gap: 9px; margin-top: 22px; padding-bottom: 34px; }
  .ph-btn { border: 1px solid #3a3a3a; color: #777; border-radius: 13px; text-align: center; padding: 10px 6px; font-weight: 500; }
  .ph-btn.on { background: #fff; color: #000; border-color: #fff; }
  .ph-chat { display: grid; gap: 16px; margin-top: 10px; }
  .ph-chat div { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
  .ph-chat i { width: 30px; height: 30px; border-radius: 50%; background: #1d1d1d; }
  .ph-chat u { display: block; height: 8px; border-radius: 4px; background: #1d1d1d; margin: 4px 0; text-decoration: none; }
  .ph-toast { margin-top: auto; margin-bottom: 20px; border: 1px solid #4a4a4a; background: #0c0c0c; border-radius: 14px; padding: 12px 14px; font-weight: 500; }
  .ph-home { position: absolute; bottom: 10px; left: 50%; width: 84px; height: 4px; margin-left: -42px; border-radius: 4px; background: #fff; opacity: .9; }

  /* The demo: a small Quiet that runs in the page. */
  .try { background: var(--soft); border-bottom: 1px solid var(--line); }
  .try-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "phone head" "phone side"; column-gap: 72px; row-gap: 28px; align-items: start; }
  .try-head { grid-area: head; align-self: end; }
  .try-head p:last-child { color: var(--muted); font-size: 18px; margin-top: 18px; max-width: 32em; }
  .try-phone { grid-area: phone; display: flex; justify-content: center; }
  .try-side { grid-area: side; }
  @media (max-width: 860px) {
    .try-grid { grid-template-columns: 1fr; grid-template-areas: "head" "phone" "side"; row-gap: 36px; }
  }
  .steps { list-style: none; margin: 0 0 26px; padding: 0; counter-reset: s; max-width: 30em; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 500 13px/1 Inter, system-ui, sans-serif; }
  .steps li.done { color: var(--fg); }
  .steps li.done::before { content: "✓"; background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .try-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { font: 500 15.5px/1 Inter, system-ui, sans-serif; min-height: 46px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; }
  .btn.ghost { background: none; color: var(--fg); border-color: var(--line); }
  .try-done { margin-top: 22px; font-weight: 500; max-width: 30em; }

  .phone.demo { width: 300px; max-width: 100%; padding: 0; font-size: 14px; user-select: none; touch-action: pan-y; }
  .demo button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
  .demo button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .demo .scr { position: absolute; inset: 0; padding: 48px 24px 44px; display: flex; flex-direction: column; animation: d-in .22s ease-out; }
  @keyframes d-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .demo .scr { animation: none; } }
  .demo .d-time { font-size: 56px; letter-spacing: -.035em; line-height: 1; margin-top: 22px; }
  .demo .d-dim { color: #8e8e8e; }
  .demo .d-pill { align-self: flex-start; margin-top: 14px; border: 1px solid #5a5a5a; border-radius: 12px; padding: 7px 12px; font-weight: 500; }
  .demo .d-list { margin-top: auto; display: grid; gap: 4px; }
  .demo .d-app { font-size: 21px; padding: 7px 0; width: 100%; }
  .demo .d-app:active { opacity: .5; }
  .demo .d-all { margin-top: 14px; color: #8e8e8e; padding: 8px 0; }
  .demo .d-search { width: 100%; background: none; border: 1px solid #3a3a3a; border-radius: 12px; color: #fff; font: inherit; padding: 10px 12px; margin: 6px 0 10px; }
  .demo .d-search::placeholder { color: #777; }
  .demo .d-scroll { overflow-y: auto; flex: 1; scrollbar-width: none; }
  .demo .d-title { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .demo .d-btn { display: block; width: 100%; border: 1px solid #fff; border-radius: 13px; text-align: center; padding: 11px 8px; font-weight: 500; margin-top: 9px; }
  .demo .d-btn.fill { background: #fff; color: #000; }
  .demo .d-btn[disabled] { border-color: #333; color: #555; cursor: default; }
  .demo .d-bar { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; padding-bottom: 12px; border-bottom: 1px solid #1f1f1f; }
  .demo .d-back { font-size: 22px; line-height: 1; padding: 2px 6px 4px 0; }
  .demo .d-chip { align-self: flex-start; margin-top: 12px; border: 1px solid #3a3a3a; border-radius: 999px; padding: 5px 11px; font-size: 12px; color: #b5b5b5; }
  .demo .d-sk { display: grid; gap: 14px; margin-top: 16px; }
  .demo .d-sk i { display: block; border-radius: 10px; background: #161616; }
  .demo .d-tabs { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #1f1f1f; }
  .demo .d-tabs button { text-align: center; padding: 12px 0 2px; font-weight: 500; color: #8e8e8e; }
  .demo .d-tabs button.on { color: #fff; }
  .demo .d-chatrow { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; width: 100%; padding: 10px 0; }
  .demo .d-chatrow i { width: 38px; height: 38px; border-radius: 50%; background: #1d1d1d; }
  .demo .d-chatrow b { display: block; font-weight: 500; font-size: 15px; }
  .demo .d-chatrow span span { color: #8e8e8e; font-size: 12.5px; }
  .demo .d-toast { position: absolute; left: 16px; right: 16px; bottom: 46px; border: 1px solid #4a4a4a; background: #0c0c0c; border-radius: 14px; padding: 12px 14px; font-weight: 500; font-size: 13px; animation: d-in .2s ease-out; z-index: 3; }
  .demo .d-homebar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: grid; place-items: center; z-index: 4; }
  .demo .d-homebar i { width: 96px; height: 4px; border-radius: 4px; background: #fff; }

  /* ---- Motion ---- */
  #prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg); transform-origin: 0 50%; transform: scaleX(var(--sp, 0)); }
  @media (hover: hover) {
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(460px circle at var(--cx, 50%) var(--cy, -30%), color-mix(in srgb, var(--fg) 7%, transparent), transparent 70%); }
  }

  /* Hero scene: scrolling turns a noisy phone into Quiet. --p runs from 0 to 1. */
  .scene { position: relative; --p: 0; }
  .scene-pin { position: relative; overflow: hidden; }
  #grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 72% 50%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse 60% 70% at 72% 50%, #000 10%, transparent 75%); }
  .scene .hero { position: relative; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 640px; }
  .chips { position: absolute; left: 50%; top: 45%; width: 0; height: 0; z-index: 2; }
  .chip { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform, opacity;
    transform: translate(-50%, -50%) translate(calc(var(--dx) * (1 - var(--p))), calc(var(--dy) * (1 - var(--p)))) scale(calc(1 - var(--p) * .7));
    opacity: calc(1 - var(--p) * 1.7); filter: blur(calc(var(--p) * 7px)); }
  .chip span { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 9px 13px; font-size: 13px; font-weight: 500;
    box-shadow: 0 10px 34px rgba(0, 0, 0, .28); animation: floaty var(--d, 4s) ease-in-out var(--delay, 0s) infinite alternate; }
  .chip span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fg); flex: none; }
  @keyframes floaty { from { transform: translateY(-8px) rotate(-1.4deg); } to { transform: translateY(8px) rotate(1.4deg); } }
  .tilt .phone { transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; will-change: transform; }
  .stage .phone { padding: 0; z-index: 1; }
  .layer { position: absolute; inset: 0; padding: 46px 24px 26px; display: flex; flex-direction: column; will-change: opacity, transform; }
  .layer.before { opacity: calc(1 - var(--p) * 1.9); transform: scale(calc(1 + var(--p) * .1)); }
  .layer.after { opacity: calc(var(--p) * 2.2 - .9); transform: translateY(calc((1 - var(--p)) * 16px)); }
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 14px; margin-top: 22px; }
  .icons i { aspect-ratio: 1; border-radius: 13px; background: #1e1e1e; position: relative; display: block; }
  .icons i:nth-child(3n) { background: #3a3a3a; } .icons i:nth-child(4n + 1) { background: #5c5c5c; } .icons i:nth-child(7n) { background: #8a8a8a; }
  .icons i b { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: #fff; color: #000; font: 600 10px/18px Inter, system-ui, sans-serif; text-align: center; padding: 0 4px; }
  .icons i.n { animation: jig 1.4s ease-in-out infinite; }
  .icons i.n:nth-child(odd) { animation-delay: -.6s; }
  @keyframes jig { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-5deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-2deg); } }
  .stage-cap { position: relative; width: 100%; height: 20px; margin-top: 24px; text-align: center; font-size: 12.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stage-cap span { position: absolute; left: 0; right: 0; }
  .cap-before { opacity: calc(1 - var(--p) * 2.2); } .cap-after { opacity: calc(var(--p) * 2.4 - 1.2); }
  .scroll-hint { display: none; }
  @media (min-width: 901px) {
    .scene { height: 240vh; }
    .scene-pin { position: sticky; top: 64px; height: calc(100vh - 64px); display: flex; align-items: center; }
    .scene .hero { padding-top: 0; padding-bottom: 0; width: 100%; }
    .stage { min-height: 0; }
    .stage .phone { width: min(264px, calc((100vh - 64px - 150px) * 9 / 19)); }
    .scroll-hint { display: flex; align-items: center; gap: 12px; position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); opacity: calc(1 - var(--p) * 5); }
    .scroll-hint::after { content: ""; width: 1px; height: 26px; background: var(--muted); animation: hint 1.6s ease-in-out infinite; transform-origin: top; }
  }
  @keyframes hint { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* Things that arrive as they scroll into view. The class is added by script only. */
  .rv { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .8s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i, 0) * 70ms); }
  .rv.in { opacity: 1; transform: none; }

  /* The story: one phone stays in place while the chapters scroll past it. */
  .pin { display: none; }
  @media (min-width: 961px) {
    .story { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 72px; align-items: start; }
    .story .rows { gap: 0; }
    .story .row { grid-template-columns: 1fr; min-height: 84vh; align-content: center; opacity: .2; transition: opacity .5s; }
    .story .row.active { opacity: 1; }
    .story .row .shot { display: none; }
    .story .row h3 { font-size: clamp(28px, 3vw, 38px); }
    .pin { display: flex; justify-content: center; position: sticky; top: calc(50vh - 300px + 32px); background: var(--soft); border: 1px solid var(--line); border-radius: 28px; padding: 44px 20px; }
    .pin .phone.swap { animation: swap .45s cubic-bezier(.2, .7, .2, 1); }
  }
  @keyframes swap { from { opacity: .2; transform: perspective(1000px) rotateY(-14deg) scale(.96); } to { opacity: 1; transform: perspective(1000px) rotateY(0) scale(1); } }

  /* The parents' phone plays its small scene while it is in view. */
  .anim .ph-chat div { opacity: 0; transform: translateY(10px); }
  .anim .ph-toast { opacity: 0; transform: translateY(18px); }
  .anim.play .ph-chat div { animation: rowin .45s ease-out forwards; }
  .anim.play .ph-chat div:nth-child(2) { animation-delay: .15s; } .anim.play .ph-chat div:nth-child(3) { animation-delay: .3s; }
  .anim.play .ph-chat div:nth-child(4) { animation-delay: .45s; } .anim.play .ph-chat div:nth-child(5) { animation-delay: .6s; }
  .anim.play .ph-chat div:nth-child(3) i { animation: ring .7s ease-in-out 1.1s 2; }
  .anim.play .ph-toast { animation: rowin .5s cubic-bezier(.2, .7, .2, 1) 2.2s forwards; }
  @keyframes rowin { to { opacity: 1; transform: none; } }
  @keyframes ring { 50% { box-shadow: 0 0 0 5px #000, 0 0 0 6.5px #fff; } }

  .closing .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 48px; align-items: center; }
  .ring { width: 132px; height: 132px; border-radius: 50%; border: 12px solid var(--fg); animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(.86); opacity: .55; } 50% { transform: scale(1.06); opacity: 1; } }
  @media (max-width: 700px) { .closing .wrap { grid-template-columns: 1fr; } .ring { width: 84px; height: 84px; border-width: 8px; } }

  @media (prefers-reduced-motion: reduce) {
    .rv { opacity: 1; transform: none; transition: none; }
    .chip span, .icons i.n, .ring, .scroll-hint::after { animation: none; }
    .tilt .phone { transition: none; }
    .scene { height: auto; } .scene-pin { position: relative; height: auto; }
    .scene .hero { padding-top: 72px; padding-bottom: 72px; }
  }

  /* ---- Things to touch ---- */
  .tabs, .ex { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs { margin-bottom: 28px; }
  .tabs button, .ex button { font: 500 14px/1 Inter, system-ui, sans-serif; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  .tabs button:hover, .ex button:hover { color: var(--fg); border-color: var(--fg); }
  .tabs button[aria-selected="true"], .ex button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .story .row { grid-template-columns: 1fr; }

let LANG = "uz";

/* ---- The demo: a small Quiet in the page. Nothing here leaves the browser. ---- */
const Demo = (() => {
  const HOME = ["phone", "messages", "camera", "instagram", "youtube", "telegram"];
  const FOCUS_HOME = ["mail", "calendar", "docs"];
  const FOCUS_ALLOWED = new Set(["mail", "calendar", "docs", "phone", "notes"]);
  const ALL = ["calendar", "camera", "clock", "docs", "instagram", "mail", "maps", "messages", "notes", "phone", "telegram", "youtube"];
  const WAIT_S = 5, VISIT_S = 8;
  const st = { screen: "home", app: null, focus: false, n: 0, min: 0, chat: -1, why: "", done: new Set(), rules: { instagram: "wait" } };
  const buzz = ms => { try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(ms); } catch (e) {} };
  let timers = [], toastTimer = null;
  const $ = id => document.getElementById(id);
  const d = () => T[LANG].d;
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const name = app => d().apps[app];
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function clear() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function mark(i) { st.done.add(i); side(); }
  function toast(text) {
    const el = $("demo-toast");
    el.innerHTML = '<div class="d-toast">' + esc(text) + "</div>";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.innerHTML = ""; }, 3200);
  }
  function go(screen, app) { clear(); st.screen = screen; if (app !== undefined) st.app = app; render(); }

  function open(app, waited) {
    if (st.focus && !FOCUS_ALLOWED.has(app)) { st.why = "focus"; go("block", app); buzz(30); if (app === "instagram") mark(2); return; }
    if (st.rules[app] === "block") { st.why = "rule"; go("block", app); buzz(30); return; }
    if (st.rules[app] === "wait" && !waited) {
      st.n = WAIT_S; go("wait", app);
      timers.push(setInterval(() => { if (st.n > 0) { st.n--; render(false); } }, 1000));
      return;
    }
    st.min = 0; go("app", app);
  }
  function visit(min) {
    const app = st.app;
    st.min = min; go("app", app); mark(1);
    later(() => { go("home"); toast(fill(d().timeup, { app: name(app) })); buzz(30); }, VISIT_S * 1000);
  }
  // Pressing and holding an app, as in Quiet itself: a rule of the visitor's own.
  function sheet(app) { go("sheet", app); buzz(20); }
  function rule(kind) {
    const app = st.app;
    if (kind === "none") delete st.rules[app]; else st.rules[app] = kind;
    go("home"); toast(fill(d().sheet_ok, { app: name(app) }));
  }
  function shorts() {
    go("shorts", "youtube");
    later(() => { st.min = 0; go("app", "youtube"); toast(d().shorts_toast); mark(3); }, 900);
  }
  function chat(i) {
    st.chat = i; go("chat", "telegram");
    if (i === 2) later(() => { go("app", "telegram"); toast(d().bot_toast); mark(4); }, 900);
  }

  const skeleton = hs => '<div class="d-sk">' + hs.map(h => '<i style="height:' + h + 'px"></i>').join("") + "</div>";
  const bar = (title, act) => '<div class="d-bar"><button type="button" class="d-back" data-act="' + act + '" aria-label="' + esc(d().back) + '">‹</button>' + esc(title) + "</div>";
  const appBtn = app => '<button type="button" class="d-app" data-act="open:' + app + '">' + esc(name(app)) + "</button>";

  function view() {

    switch (st.screen) {
      case "home": {
        const list = (st.focus ? FOCUS_HOME : HOME).map(appBtn).join("");
        return '<div class="d-time">' + clock() + '</div><div class="d-dim" style="margin-top:10px">' + esc(today()) + "</div>" +
          (st.focus ? '<div class="d-pill">' + esc(t.pill) + "</div>" : '<div class="d-dim">' + esc(t.today) + "</div>") +
          '<div class="d-list">' + list + '</div><button type="button" class="d-all" data-act="drawer">' + esc(t.all) + " ↑</button>";
      }
      case "drawer":
        return bar(t.all, "home") + '<input class="d-search" id="demo-q" type="search" autocomplete="off" placeholder="' + esc(t.search) + '" aria-label="' + esc(t.search) + '">' +
          '<div class="d-scroll" id="demo-apps">' + drawerList("") + "</div>";
      case "sheet": {
        const now = st.rules[st.app] || "none";
        return bar(name(st.app), "home") + '<div class="d-dim" style="margin:16px 0 8px">' + esc(t.sheet_p) + "</div>" +
          [["wait", t.sheet_wait], ["block", t.sheet_block], ["none", t.sheet_none]].map(o =>
            '<button type="button" class="d-btn' + (o[0] === now ? " fill" : "") + '" data-act="rule:' + o[0] + '">' + esc(o[1]) + "</button>").join("");
      }
      case "wait": {
        const ready = st.n <= 0;
        return '<div style="margin-top:auto"></div><div class="d-title">' + esc(fill(t.opening, { app: name(st.app) })) + "</div>" +
          '<div class="d-dim" style="margin-top:8px">' + (ready ? "&nbsp;" : esc(fill(t.wait, { n: st.n }))) + '</div><div class="d-dim">' + esc(t.used) + "</div>" +
          '<div style="margin:16px 0 12px">' + esc(t.why) + "</div>" +
          '<button type="button" class="d-btn fill" data-act="home">' + esc(t.go_home) + "</button>" +
          [5, 10, 20].map(m => '<button type="button" class="d-btn" data-act="visit:' + m + '"' + (ready ? "" : " disabled") + ">" + esc(fill(t.cont, { n: m })) + "</button>").join("");
      }
      case "block":
        return '<div style="margin-top:auto"></div><div class="d-title">' + esc(fill(st.why === "rule" ? t.block2_h : t.block_h, { app: name(st.app) })) + "</div>" +
          '<div class="d-dim" style="margin:10px 0 18px">' + esc(st.why === "rule" ? t.block2_p : t.block_p) + "</div>" +
          '<button type="button" class="d-btn fill" data-act="home">' + esc(t.go_home) + "</button>";
      case "shorts":
        return bar("Shorts", "open:youtube") + skeleton([330]);
      case "chat":
        return bar(t.chats[st.chat], "open:telegram") + '<div class="d-dim" style="margin-top:8px">' + (st.chat === 2 ? "bot" : "") + "</div>" + skeleton([44, 60, 36]);
      case "app":
        if (st.app === "youtube")
          return bar("YouTube", "home") + skeleton([120, 14, 120, 14]) +
            '<div class="d-tabs"><button type="button" class="on" data-act="open:youtube">' + esc(t.tab_home) + '</button><button type="button" data-act="shorts">Shorts</button></div>';
        if (st.app === "telegram")
          return bar("Telegram", "home") + '<div style="margin-top:8px">' + t.chats.map((c, i) =>
            '<button type="button" class="d-chatrow" data-act="chat:' + i + '"><i></i><span><b>' + esc(c) + "</b><span>" + esc(t.subs[i]) + "</span></span></button>").join("") + "</div>";
        return bar(name(st.app), "home") +
          (st.min ? '<div class="d-chip">' + esc(fill(t.chip, { n: st.min, s: VISIT_S })) + "</div>" : "") +
          skeleton(st.app === "instagram" ? [36, 200, 14, 14] : [60, 40, 90, 40]);
    }
    return "";
  }
  function drawerList(q) {
    q = q.trim().toLowerCase();
    return ALL.map(a => [a, name(a)]).filter(p => p[1].toLowerCase().includes(q)).sort((a, b) => a[1].localeCompare(b[1], LANG))
      .map(p => appBtn(p[0])).join("");
  }
  function clock() { const n = new Date(); return n.getHours() + ":" + String(n.getMinutes()).padStart(2, "0"); }
  function today() {
    // Written out by hand: many browsers have no Uzbek calendar and print "M11 19, Thu".
    const n = new Date(), day = n.getDate();
    const W = {
      uz: ["Yakshanba", "Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba"],
      ru: ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"],
      en: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
    }[LANG][n.getDay()];
    const M = {
      uz: ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"],
      ru: ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"],
      en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
    }[LANG][n.getMonth()];
    return LANG === "uz" ? W + ", " + day + "-" + M : W + ", " + day + " " + M;
  }
  function render(animate) {
    const el = $("demo-screen");
    if (!el) return;
    el.innerHTML = '<div class="scr"' + (animate === false ? ' style="animation:none"' : "") + ">" + view() + "</div>";
    $("demo-clock").textContent = clock();
    $("demo-home").setAttribute("aria-label", d().home_btn);
  }
  let cur = 0;
  function side() {
    const t = d();
    document.querySelectorAll(".story .task").forEach((el, i) => el.classList.toggle("done", st.done.has(i)));
    $("demo-reset").textContent = t.reset;
    const done = $("demo-done");
    done.textContent = t.done;
    done.hidden = st.done.size < 5;
    $("story-tabs").innerHTML = t.tabs.map((name, i) =>
      '<button type="button" role="tab" data-ch="' + i + '" aria-selected="' + (i === cur) + '">' + esc(name) + "</button>").join("");
  }
  // Each chapter of the story puts the phone into its own state.
  function scene(i) {
    cur = i; st.focus = i === 2; $("demo-toast").innerHTML = "";
    if (i === 1) open("instagram"); else if (i === 3) open("youtube"); else if (i === 4) open("telegram"); else go("home");
    side();
  }
  function act(a) {
    const [what, arg] = a.split(":");
    buzz(8);
    if (what === "home") go("home");
    else if (what === "drawer") { go("drawer"); mark(0); }
    else if (what === "open") open(arg);
    else if (what === "visit") visit(Number(arg));
    else if (what === "shorts") shorts();
    else if (what === "chat") chat(Number(arg));
    else if (what === "rule") rule(arg);
  }
  function init() {
    const phone = $("demo");
    let press = null, held = false;
    const appOf = e => { const b = e.target.closest(".d-app"); return b ? b.dataset.act.split(":")[1] : null; };
    phone.addEventListener("pointerdown", e => { held = false; const app = appOf(e); clearTimeout(press); if (app) press = setTimeout(() => { held = true; sheet(app); }, 520); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => phone.addEventListener(ev, () => { clearTimeout(press); setTimeout(() => { held = false; }, 0); }));
    phone.addEventListener("contextmenu", e => { const app = appOf(e); if (app) { e.preventDefault(); clearTimeout(press); sheet(app); } });
    phone.addEventListener("click", e => {
      if (held) { held = false; return; }
      const b = e.target.closest("[data-act]");
      if (b && !b.disabled) act(b.dataset.act);
    });
    phone.addEventListener("input", e => {
      if (e.target.id === "demo-q") $("demo-apps").innerHTML = drawerList(e.target.value);
    });
    // Swipe up on the home screen opens the app list, as in the app.
    let y0 = null;
    phone.addEventListener("pointerdown", e => { y0 = e.clientY; });
    phone.addEventListener("pointerup", e => { if (y0 !== null && st.screen === "home" && y0 - e.clientY > 50) go("drawer"); y0 = null; });
    $("demo-reset").addEventListener("click", () => { st.done.clear(); scene(cur); });
    $("story-tabs").addEventListener("click", e => { const b = e.target.closest("[data-ch]"); if (b) FX.pick(Number(b.dataset.ch)); });
    setInterval(() => { if (st.screen === "home") render(false); }, 20000);
  }
  return { init, scene, refresh() { render(false); side(); } };
})();

/* ---- Motion: the hero scene, the pinned story, reveals. All of it yields to "reduce motion". ---- */
const FX = (() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const clamp = v => Math.max(0, Math.min(1, v));
  const SPOTS = [[-190, -215], [175, -235], [-235, -95], [220, -115], [-210, 45], [228, 35], [-185, 175], [195, 185], [-55, -300], [70, 285]];
  let scene, stage, ticking = false, pointer = { x: -999, y: -999 }, gridOn = false, prog = 0;

  function chips() {
    $("chips").onclick = e => { const c = e.target.closest(".chip"); if (c) c.classList.add("gone"); };
    $("chips").innerHTML = T[LANG].d.noise.map((text, i) =>
      '<div class="chip" style="--dx:' + SPOTS[i][0] + "px;--dy:" + SPOTS[i][1] + "px;--d:" + (3.2 + (i % 4) * .7) + "s;--delay:-" + (i * .45) + 's"><span>' + text + "</span></div>").join("");
  }

  function frame() {
    ticking = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    $("prog").style.setProperty("--sp", max > 0 ? clamp(scrollY / max) : 0);
    let p = 1;
    if (!reduce) {
      if (innerWidth > 900) {
        const r = scene.getBoundingClientRect();
        p = clamp((64 - r.top) / (r.height - (innerHeight - 64)) * 1.3);
      } else {
        const s = stage.getBoundingClientRect();
        p = clamp((innerHeight * .5 - s.top) / (innerHeight * .4));
      }
    }
    scene.style.setProperty("--p", p.toFixed(4)); prog = p;
    // Reveals and the story's chapter are worked out from positions, so a jump down the page
    // (a menu link, a restored scroll position) never leaves anything hidden.
    const edge = innerHeight * .92;
    pending = pending.filter(el => { if (el.getBoundingClientRect().top < edge) { el.classList.add("in"); const h2 = el.tagName === "H2" ? el : null; if (h2) scramble(h2); return false; } return true; });
    if (storyRows.length && innerWidth > 960) {
      const mid = innerHeight / 2;
      let best = storyRows[0], gap = Infinity;
      for (const r of storyRows) { const b = r.getBoundingClientRect(), g = Math.abs((b.top + b.bottom) / 2 - mid); if (g < gap) { gap = g; best = r; } }
      setActive(best);
    }
  }
  // One measurement and two style writes: cheap enough to run on the event itself, and it keeps
  // working in a tab whose animation frames are paused.
  function onScroll() { frame(); }

  // Noise that settles: specks drift everywhere, and as the scene plays they gather into
  // Quiet's ring around the phone. They shy away from the pointer; a click sends a wave through.
  let shock = null;
  function grid() {
    const cv = $("grid"), ctx = cv.getContext("2d");
    const N = innerWidth > 900 ? 1300 : 520;
    let w = 0, h = 0, fg = "#fff", cx = 0, cy = 0, R = 200, n = 0;
    const P = [];
    function place() {
      const s = stage.querySelector(".phone").getBoundingClientRect(), c = cv.getBoundingClientRect();
      cx = s.left + s.width / 2 - c.left; cy = s.top + s.height / 2 - c.top; R = Math.max(s.height * .6, 190);
    }
    function size() {
      const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
      w = r.width; h = r.height; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      fg = getComputedStyle(document.body).color; place();
    }
    size();
    for (let i = 0; i < N; i++) P.push({ x: Math.random() * w, y: Math.random() * h, vx: 0, vy: 0, a: i / N * 6.2832, o: (Math.random() + Math.random() - 1) * 16, s: 1 + Math.random() * 1.2 });
    function draw() {
      const p = reduce ? 1 : prog, pull = .03 * p * p, wild = (1 - p) * .55;
      if (++n % 30 === 0) { place(); fg = getComputedStyle(document.body).color; }
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = fg; ctx.globalAlpha = .28 + .5 * p;
      for (const q of P) {
        q.a += .0007;
        const tx = cx + Math.cos(q.a) * (R + q.o), ty = cy + Math.sin(q.a) * (R + q.o);
        q.vx += (Math.random() - .5) * wild + (tx - q.x) * pull;
        q.vy += (Math.random() - .5) * wild + (ty - q.y) * pull;
        const dx = q.x - pointer.x, dy = q.y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < 19600) { const d = Math.sqrt(d2) || 1, f = (1 - d / 140) * 1.8; q.vx += dx / d * f; q.vy += dy / d * f; }
        if (shock) { const sx = q.x - shock.x, sy = q.y - shock.y, d = Math.hypot(sx, sy) || 1; if (d < 320) { const f = (1 - d / 320) * 16; q.vx += sx / d * f; q.vy += sy / d * f; } }
        q.vx *= .9; q.vy *= .9; q.x += q.vx; q.y += q.vy;
        if (p < .3) { if (q.x < 0) q.x += w; else if (q.x > w) q.x -= w; if (q.y < 0) q.y += h; else if (q.y > h) q.y -= h; }
        ctx.fillRect(q.x, q.y, q.s, q.s);
      }
      shock = null;
      if (gridOn && !reduce) requestAnimationFrame(draw);
    }
    if (reduce) { for (const q of P) { q.x = cx + Math.cos(q.a) * (R + q.o); q.y = cy + Math.sin(q.a) * (R + q.o); } draw(); }
    addEventListener("resize", () => { size(); if (reduce) draw(); });
    new IntersectionObserver(es => {
      const on = es[0].isIntersecting;
      if (on && !gridOn) { gridOn = true; requestAnimationFrame(draw); } else if (!on) gridOn = false;
    }).observe(cv);
    const box = cv.parentElement;
    box.addEventListener("pointermove", e => { const r = cv.getBoundingClientRect(); pointer = { x: e.clientX - r.left, y: e.clientY - r.top }; });
    box.addEventListener("pointerleave", () => { pointer = { x: -999, y: -999 }; });
    box.addEventListener("click", e => {
      if (e.target.closest("a, button, .chip")) return;
      const r = cv.getBoundingClientRect(); shock = { x: e.clientX - r.left, y: e.clientY - r.top };
    });
  }

  // Headings arrive as noise and settle into words.
  function scramble(el) {
    const text = T[LANG][el.dataset.t];
    if (reduce || !text) return;
    const G = "/\\—·:░▒"; let i = 0; const total = 20;
    clearInterval(el._s);
    el._s = setInterval(() => {
      i++;
      const cut = Math.floor(text.length * i / total);
      el.textContent = text.slice(0, cut) + [...text.slice(cut)].map(ch => ch === " " ? " " : G[Math.random() * G.length | 0]).join("");
      if (i >= total) { clearInterval(el._s); el.textContent = text; }
    }, 30);
  }

  // A ring that trails the pointer, a theme that wipes across the page, buttons that lean in.
  function ultra() {
    const root = document.documentElement;
    $("theme").addEventListener("click", e => {
      const now = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      const next = now === "dark" ? "light" : "dark";
      const set = () => { root.dataset.theme = next; try { localStorage.setItem("quiet-theme", next); } catch (err) {} };
      if (!document.startViewTransition || reduce) { set(); return; }
      const x = e.clientX, y = e.clientY, r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.startViewTransition(set).ready.then(() => root.animate(
        { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + r + "px at " + x + "px " + y + "px)"] },
        { duration: 700, easing: "cubic-bezier(.4, 0, .2, 1)", pseudoElement: "::view-transition-new(root)" }));
    });
    if (reduce || !matchMedia("(hover: hover)").matches) return;
    const cur = $("cur"); let x = -100, y = -100, tx = -100, ty = -100;
    addEventListener("pointermove", e => {
      tx = e.clientX; ty = e.clientY; cur.style.opacity = 1;
      cur.style.setProperty("--s", e.target.closest && e.target.closest("a, button, input, label, summary, .chip") ? 2.3 : 1);
    }, { passive: true });
    (function loop() { x += (tx - x) * .2; y += (ty - y) * .2; cur.style.setProperty("--x", x + "px"); cur.style.setProperty("--y", y + "px"); requestAnimationFrame(loop); })();
    document.querySelectorAll(".mag, .btn").forEach(el => {
      el.classList.add("mag");
      el.addEventListener("pointermove", e => { const r = el.getBoundingClientRect(); el.style.transform = "translate(" + (e.clientX - r.left - r.width / 2) * .28 + "px," + (e.clientY - r.top - r.height / 2) * .28 + "px)"; });
      el.addEventListener("pointerleave", () => { el.style.transform = ""; });
    });
  }

  function tilt() {
    if (reduce || !matchMedia("(hover: hover)").matches) return;
    document.querySelectorAll(".tilt").forEach(box => {
      box.addEventListener("pointermove", e => {
        const r = box.getBoundingClientRect();
        const k = box.dataset.tilt === "soft" ? .35 : (e.buttons & 1 ? 3.2 : 1);
        box.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 16 * k + "deg");
        box.style.setProperty("--rx", (.5 - (e.clientY - r.top) / r.height) * 12 * k + "deg");
      });
      box.addEventListener("pointerleave", () => { box.style.setProperty("--ry", "0deg"); box.style.setProperty("--rx", "0deg"); });
    });
    addEventListener("pointermove", e => {
      document.body.style.setProperty("--cx", e.clientX + "px");
      document.body.style.setProperty("--cy", e.clientY + "px");
    }, { passive: true });
  }

  let pending = [], storyRows = [];
  function reveals() {
    if (reduce) return;
    const io = { observe: el => pending.push(el) };
    const groups = [".facts li", ".sec-head > *", ".bento .card", ".tester", ".chooser", ".perm", ".year-grid > *", ".cols li", "tbody tr", ".faq details", ".privacy .body p", ".closing h2", ".closing p", ".price-note"];
    groups.forEach(sel => {
      const byParent = new Map();
      document.querySelectorAll(sel).forEach(el => {
        const n = byParent.get(el.parentElement) || 0; byParent.set(el.parentElement, n + 1);
        el.classList.add("rv"); el.style.setProperty("--i", Math.min(n, 8)); io.observe(el);
      });
    });
  }

  // The pinned phone shows the screen of whichever chapter is in the middle of the window.
  let active = null;
  function setActive(row) {
    if (row === active) return;
    active = row;
    storyRows.forEach(r => r.classList.toggle("active", r === row));
    Demo.scene(storyRows.indexOf(row));
  }
  function story() {
    storyRows = [...document.querySelectorAll(".story .row")];
    if (storyRows.length) setActive(storyRows[0]);
  }
  // A tab was tapped: on a wide screen scroll to that chapter, on a narrow one just show it.
  function pick(i) {
    const row = storyRows[i];
    if (!row) return;
    if (innerWidth > 960) scrollTo({ top: row.getBoundingClientRect().top + scrollY - (innerHeight - row.offsetHeight) / 2, behavior: reduce ? "auto" : "smooth" });
    else setActive(row);
  }

  function parents() {
    const phone = document.querySelector("#parents .phone");
    if (!phone || reduce) return;
    phone.classList.add("anim");
    let loop = null;
    const play = () => { phone.classList.remove("play"); void phone.offsetWidth; phone.classList.add("play"); };
    new IntersectionObserver(es => {
      clearInterval(loop);
      if (es[0].isIntersecting) { play(); loop = setInterval(play, 6500); }
    }, { threshold: .5 }).observe(phone);
  }

  function init() {
    scene = $("scene"); stage = $("stage");
    grid(); tilt(); reveals(); story(); parents(); ultra();
    const h1 = document.querySelector("h1"); if (h1) scramble(h1);
    addEventListener("scroll", onScroll, { passive: true });
    addEventListener("resize", onScroll);
    frame();
  }
  return { init, pick, lang() { chips(); document.querySelectorAll("h1, h2").forEach(el => clearInterval(el._s)); } };
})();

    $("y-ho").textContent = dur(min); $("y-co").textContent = dur(cut);
    $("y-line1").textContent = fill(w().yPct, { p: Math.round(min / 960 * 100) });
    $("y-line2").textContent = back > 0 ? fill(w().ySave, { c: dur(cut), d: back }) : w().yNone;
    [...dots.children].forEach((el, i) => { el.className = i < days - back ? "t" : i < days ? "s" : ""; });
  }

  function on(id, type, fn) { $(id).addEventListener(type, fn); }
  function pick(id, fn) { on(id, "click", e => { const b = e.target.closest("[data-i]"); if (b) fn(Number(b.dataset.i)); }); }

  function init() {
    pick("time-seg", i => { tab = i; bar = -1; time(); });
    pick("time-bars", i => { bar = bar === i ? -1 : i; time(); });
    on("hold-on", "change", () => { if ($("hold-on").checked) popped = []; hold(); });
    setInterval(arrive, 1900);
    on("sched", "input", sched);
    setInterval(() => { left = left > 0 ? left - 1 : 25 * 60; strict(); }, 1000);
    on("strict-end", "click", () => {
      refused = true; strict();
      const t = $("strict-time"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
    });
    on("y-h", "input", year); on("y-c", "input", year);
    on("gray-on", "change", () => $("feed").classList.toggle("gray", $("gray-on").checked));
    on("guard-in", "input", () => guard(true));
    on("guard-ex", "click", e => { const b = e.target.closest("button"); if (b) { $("guard-in").value = b.textContent; guard(true); } });
    pick("needs", i => { picked.has(i) ? picked.delete(i) : picked.add(i); needs(); });
    pick("perm-tabs", i => { perm = i; perms(); });
    on("ring", "click", () => {
      const ring = $("ring");
      if (breathing !== null) { clearInterval(breathing); breathing = null; ring.classList.remove("go"); ringCap(); return; }
      phase = 0; ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
      breathing = setInterval(() => { phase++; ringCap(); }, 4000); ringCap();
    });
  }
  function lang() {
    time(); hold(); sched(); strict(); needs(); perms(); ringCap(); year();
    $("guard-in").placeholder = w().gPh;
    $("sched").setAttribute("aria-label", T[LANG].d4_h);
    $("ring").setAttribute("aria-label", w().ring);
    $("guard-ex").innerHTML = w().gEx.map(x => '<button type="button">' + esc(x) + "</button>").join("");
    guard(false);
  }
  return { init, lang };
})();

function pickLang() {
  try { const saved = localStorage.getItem("quiet-lang"); if (saved && T[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "uz").slice(0, 2).toLowerCase();
  return T[nav] ? nav : "uz";
}

function apply(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  // The policy in the same language as the page.
  const policy = "https://encrypster.github.io/quiet-privacy/" + (lang === "en" ? "" : lang + "/");
  document.getElementById("privacy-link").href = policy;
  document.getElementById("privacy-link-foot").href = policy;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("quiet-lang", lang); } catch (e) {}
  LANG = lang;
  Demo.refresh();
  FX.lang();
  Touch.lang();
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => apply(b.dataset.lang)));
Demo.init();
Touch.init();
apply(pickLang());
FX.init();
</script>
