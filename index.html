<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet — Android uchun sokin bosh ekran</title>
<meta name="description" content="Quiet bosh ekranni oddiy matnli ro‘yxatga aylantiradi va vaqtingizni oladigan ilovalar oldiga kichik to‘siq qo‘yadi. Android 8 va undan yangi.">
<meta property="og:title" content="Quiet — Android uchun sokin bosh ekran">
<meta property="og:description" content="Matnli bosh ekran, ilova limitlari, fokus va ota-ona qulfi. Ro‘yxatdan o‘tish shart emas.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --fg: #0b0b0c; --muted: #5d5f66; --line: #e7e7ea; --soft: #f5f5f7; --card: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0c; --fg: #f4f4f5; --muted: #9c9ca4; --line: #242428; --soft: #131315; --card: #111113;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0c; --fg: #f4f4f5; --muted: #9c9ca4; --line: #242428; --soft: #131315; --card: #111113;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 17px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; overflow-wrap: break-word;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 6px; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
  h1 { font-size: clamp(34px, 8.6vw, 62px); letter-spacing: -.04em; line-height: 1.04; }
  h2 { font-size: clamp(27px, 5.6vw, 42px); }
  h3 { font-size: 19px; letter-spacing: -.015em; line-height: 1.3; }
  p { text-wrap: pretty; }
  .wrap { width: 100%; max-width: 1128px; margin: 0 auto; padding: 0 20px; }
  section { padding: 72px 0; scroll-margin-top: 60px; }
  section + section { border-top: 1px solid var(--line); }
  .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  .sub { color: var(--muted); font-size: 18px; margin-top: 16px; max-width: 62ch; }
  .head { margin-bottom: 40px; }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -.02em; text-decoration: none; }
  .logo i { width: 18px; height: 18px; border-radius: 50%; border: 3.5px solid var(--fg); display: block; }
  header nav { display: none; gap: 28px; margin-left: 28px; }
  header nav a { text-decoration: none; font-size: 15px; color: var(--muted); }
  header nav a:hover { color: var(--fg); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button { font-size: 13px; font-weight: 500; padding: 5px 10px; border-radius: 999px; color: var(--muted); line-height: 1.2; }
  .langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .theme { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; flex: none; }
  .theme svg { width: 17px; height: 17px; }

  /* Hero */
  .hero { padding: 48px 0 64px; }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 48px; }
  .hero .lead { font-size: 19px; color: var(--muted); margin-top: 20px; max-width: 54ch; }
  .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 28px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; background: var(--fg); color: var(--bg); font-weight: 500; font-size: 16px; padding: 13px 20px; border-radius: 999px; line-height: 1.2; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .6; flex: none; }
  .more { font-weight: 500; font-size: 16px; text-underline-offset: 5px; }
  .facts { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 32px; color: var(--muted); font-size: 14.5px; }
  .facts li { display: flex; align-items: center; gap: 8px; }
  .facts li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; }

  /* The phone. Always dark: that is how Quiet looks. */
  .stage { background: var(--soft); border: 1px solid var(--line); border-radius: 28px; padding: 28px 16px 20px; display: flex; flex-direction: column; align-items: center; }
  .phone { --pw: min(280px, 72vw); width: var(--pw); aspect-ratio: 9 / 18.5; background: #000; border-radius: calc(var(--pw) * .15); padding: calc(var(--pw) * .032); box-shadow: 0 0 0 1px #2c2c30, 0 24px 60px rgba(0,0,0,.28); flex: none; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--pw) * .12); overflow: hidden; background: #000; color: #fff; font-size: calc(var(--pw) * .05); line-height: 1.35; }
  .sc { position: absolute; inset: 0; padding: 14% 9% 9%; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s .45s; }
  .sc.on { opacity: 1; visibility: visible; transition: opacity .45s ease; }
  .sc .dim { color: #8d8d95; }
  .clock { font-size: 3.5em; font-weight: 300; letter-spacing: -.04em; line-height: 1; }
  .date { margin-top: .5em; font-size: .92em; }
  .today { font-size: .8em; color: #8d8d95; margin-top: .2em; }
  .apps { list-style: none; margin-top: auto; display: flex; flex-direction: column; gap: .15em; }
  .apps li { font-size: 1.3em; font-weight: 500; padding: .28em .5em; margin: 0 -.5em; border-radius: .5em; transition: background .25s; position: relative; }
  .apps li.off { color: #4a4a50; text-decoration: line-through; text-decoration-thickness: 1px; }
  .hint { font-size: .78em; color: #6d6d75; margin-top: .9em; }
  .dot { position: absolute; right: 18%; top: 50%; width: 2.2em; height: 2.2em; margin-top: -1.1em; border-radius: 50%; background: rgba(255,255,255,.28); box-shadow: 0 0 0 .35em rgba(255,255,255,.1); opacity: 0; transform: scale(.4); transition: opacity .25s, transform .25s; pointer-events: none; }
  .tap .sc.on .tapme { background: rgba(255,255,255,.14); }
  .tap .sc.on .tapme .dot { opacity: 1; transform: scale(1); }

  .sc.wait { justify-content: flex-end; }
  .wait b { font-size: 1.35em; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
  .wait .bar { height: 3px; background: #26262a; border-radius: 3px; margin: .9em 0; overflow: hidden; }
  .wait .bar i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(.35); }
  .auto .sc.wait.on .bar i { animation: bar var(--d, 5s) linear both; }
  @keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .wait .why { margin-top: .9em; font-weight: 500; }
  .btns { display: flex; flex-direction: column; gap: .5em; margin-top: .8em; }
  .btns > span { display: block; text-align: center; font-size: .9em; font-weight: 500; padding: .75em .6em; border-radius: .9em; border: 1px solid #2a2a2e; color: #8d8d95; position: relative; transition: transform .2s; }
  .btns > span.main { background: #fff; color: #000; border-color: #fff; }
  .tap .sc.on .btns > span.main { transform: scale(.96); }
  .btns .dot { right: 12%; background: rgba(0,0,0,.25); box-shadow: 0 0 0 .35em rgba(0,0,0,.1); }
  .tap .sc.on .btns .dot { opacity: 1; transform: scale(1); }

  .tag { align-self: flex-start; font-size: .8em; font-weight: 500; border: 1px solid #3a3a40; border-radius: 999px; padding: .35em .9em; margin-bottom: 1.2em; display: inline-flex; align-items: center; gap: .5em; }
  .tag::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: #fff; }

  .sc.guard { padding: 0; }
  .chat-top { padding: 13% 9% 4%; border-bottom: 1px solid #1d1d20; font-weight: 600; display: flex; align-items: center; gap: .6em; }
  .chat-top i { width: 1.8em; height: 1.8em; border-radius: 50%; background: #2a2a2e; flex: none; }
  .chat { padding: 6% 9%; display: flex; flex-direction: column; gap: .6em; filter: blur(0); transition: filter .4s, opacity .4s; }
  .chat i { display: block; height: 2.2em; border-radius: .8em; background: #1c1c1f; width: 70%; }
  .chat i:nth-child(2) { width: 52%; }
  .chat i:nth-child(3) { height: 6.5em; width: 78%; background: #232327; }
  .chat i:nth-child(4) { width: 44%; align-self: flex-end; background: #2c2c31; }
  .toast { position: absolute; left: 7%; right: 7%; bottom: 8%; background: #fff; color: #000; border-radius: 1.1em; padding: 1em 1.1em; font-size: .92em; font-weight: 500; line-height: 1.35; display: flex; gap: .8em; align-items: center; opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .35s; }
  .toast::before { content: ""; width: 1.3em; height: 1.3em; border-radius: 50%; border: .28em solid #000; flex: none; }
  .tap .sc.guard.on .chat, .still .chat { filter: blur(6px); opacity: .45; }
  .tap .sc.guard.on .toast, .still .toast { opacity: 1; transform: none; }

  /* Under the phone: what it is showing, and the four parts */
  .cap { margin-top: 22px; text-align: center; font-weight: 500; font-size: 16px; line-height: 1.35; min-height: 2.7em; max-width: 30ch; display: flex; align-items: center; justify-content: center; }
  .segs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-top: 12px; }
  .segs button { text-align: left; padding: 8px 0 4px; font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segs button::before { content: ""; display: block; height: 3px; border-radius: 3px; background: var(--line); margin-bottom: 8px; }
  .segs button { position: relative; }
  .segs button i { position: absolute; left: 0; top: 8px; height: 3px; width: 100%; border-radius: 3px; background: var(--fg); transform-origin: left; transform: scaleX(0); }
  .segs button[aria-selected="true"] { color: var(--fg); }
  .segs button[aria-selected="true"] i { transform: scaleX(1); }
  .segs button.run i { animation: bar var(--d, 5s) linear both; }

  /* How it works */
  .steps { display: grid; gap: 56px; }
  .step { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: center; }
  .step .n { font-size: 13px; font-weight: 500; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }
  .step h3 { font-size: clamp(22px, 4.6vw, 28px); letter-spacing: -.025em; line-height: 1.2; }
  .step p { color: var(--muted); margin-top: 12px; max-width: 52ch; }
  .shot { background: var(--soft); border: 1px solid var(--line); border-radius: 24px; padding: 28px 16px 0; display: flex; justify-content: center; overflow: hidden; }
  .shot .phone { --pw: min(240px, 62vw); aspect-ratio: 9 / 13; border-radius: calc(var(--pw) * .15) calc(var(--pw) * .15) 0 0; padding-bottom: 0; box-shadow: 0 0 0 1px #2c2c30; }
  .shot .screen { border-radius: calc(var(--pw) * .12) calc(var(--pw) * .12) 0 0; }
  .shot .sc { opacity: 1; visibility: visible; padding-bottom: 12%; }

  /* Features */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
  .card svg { width: 24px; height: 24px; margin-bottom: 18px; display: block; }
  .card p { color: var(--muted); font-size: 16px; margin-top: 8px; }

  /* Parents */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .col { border: 1px solid var(--line); border-radius: 20px; padding: 24px; background: var(--card); }
  .col > h3 { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .col ul { list-style: none; }
  .col li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 14px; padding: 16px 0; }
  .col li + li { border-top: 1px solid var(--line); }
  .col li svg { width: 22px; height: 22px; margin-top: 2px; }
  .col li p { color: var(--muted); font-size: 16px; margin-top: 4px; }
  .col li h4 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; }

  /* Pricing */
  .table { border: 1px solid var(--line); border-radius: 20px; background: var(--card); overflow: hidden; }
  .tr { display: grid; grid-template-columns: minmax(0, 1fr) 68px 78px; gap: 10px; padding: 14px 18px; align-items: center; font-size: 15.5px; line-height: 1.35; }
  .tr + .tr { border-top: 1px solid var(--line); }
  .tr.th { font-size: 12.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--soft); }
  .tr span:nth-child(2) { color: var(--muted); }
  .tr span:nth-child(3) { font-weight: 600; }
  .tr.th span:nth-child(3) { color: var(--fg); }
  .note { color: var(--muted); font-size: 15px; margin-top: 18px; max-width: 62ch; }

  /* Privacy */
  .privacy p { color: var(--muted); font-size: 18px; max-width: 62ch; }
  .privacy p + p { margin-top: 16px; }
  .privacy a { color: var(--fg); font-weight: 500; text-underline-offset: 5px; }

  /* FAQ */
  .faq { border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; padding: 20px 0; font-weight: 500; font-size: 18px; line-height: 1.35; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-weight: 400; font-size: 22px; line-height: 1.1; color: var(--muted); flex: none; }
  .faq details[open] summary::after { content: "–"; }
  .faq details p { color: var(--muted); padding: 0 0 22px; max-width: 66ch; }

  /* End */
  .end-box { background: var(--fg); color: var(--bg); border-radius: 28px; padding: 44px 24px; text-align: center; }
  .end-box h2 { max-width: 18ch; margin: 0 auto; }
  .end-box p { opacity: .72; margin: 16px auto 0; max-width: 46ch; }
  .end-box .pill { background: var(--bg); color: var(--fg); margin-top: 26px; }
  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 14.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  footer a { text-underline-offset: 4px; }
  footer .sp { margin-right: auto; }

  @media (min-width: 720px) {
    .wrap { padding: 0 32px; }
    section { padding: 96px 0; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card, .col { padding: 28px; }
    .tr { grid-template-columns: minmax(0, 1fr) 120px 120px; padding: 16px 28px; font-size: 16.5px; }
    .end-box { padding: 72px 40px; }
    .step { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; }
    .step:nth-child(even) .shot { order: -1; }
    .steps { gap: 72px; }
    .head { margin-bottom: 56px; }
  }
  @media (min-width: 960px) {
    header nav { display: flex; }
    .hero { padding: 72px 0 96px; }
    .hero-grid { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 64px; align-items: center; }
    .stage { padding: 40px 24px 28px; }
    .phone { --pw: 290px; }
    .shot .phone { --pw: 260px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    section { padding: 112px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top"><i></i>Quiet</a>
    <nav>
      <a href="#how" data-t="nav_how"></a>
      <a href="#parents" data-t="nav_parents"></a>
      <a href="#pricing" data-t="nav_pricing"></a>
      <a href="#faq" data-t="nav_faq"></a>
    </nav>
    <div class="tools">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="uz">UZ</button>
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="theme" id="theme" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow" data-t="kicker"></p>
        <h1 data-t="h1"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="cta">
          <span class="pill"><i></i><span data-t="status"></span></span>
          <a class="more" href="#how" data-t="more"></a>
        </div>
        <ul class="facts">
          <li data-t="fact1"></li>
          <li data-t="fact2"></li>
          <li data-t="fact3"></li>
        </ul>
      </div>
      <div class="stage" id="player">
        <div class="phone"><div class="screen" id="p-screen" aria-hidden="true"></div></div>
        <p class="cap" id="p-cap" aria-live="off"></p>
        <div class="segs" id="p-segs" role="tablist"></div>
      </div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <div class="head">
        <h2 data-t="how_h"></h2>
        <p class="sub" data-t="how_p"></p>
      </div>
      <div class="steps">
        <div class="step">
          <div><p class="n">01</p><h3 data-t="r1_h"></h3><p data-t="r1_p"></p></div>
          <div class="shot" aria-hidden="true"><div class="phone"><div class="screen" data-shot="home"></div></div></div>
        </div>
        <div class="step">
          <div><p class="n">02</p><h3 data-t="r2_h"></h3><p data-t="r2_p"></p></div>
          <div class="shot" aria-hidden="true"><div class="phone"><div class="screen" data-shot="wait"></div></div></div>
        </div>
        <div class="step">
          <div><p class="n">03</p><h3 data-t="r3_h"></h3><p data-t="r3_p"></p></div>
          <div class="shot" aria-hidden="true"><div class="phone"><div class="screen" data-shot="focus"></div></div></div>
        </div>
      </div>
    </div>
  </section>

  <section id="more">
    <div class="wrap">
      <div class="head"><h2 data-t="also_h"></h2></div>
      <div class="grid">
        <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></svg><h3 data-t="d1_h"></h3><p data-t="d1_p"></p></div>
        <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/></svg><h3 data-t="d2_h"></h3><p data-t="d2_p"></p></div>

let LANG = "uz";

// Short names for the four parts of the walkthrough.
T.uz.tabs = ["Bosh ekran", "Kutish", "Fokus", "Himoya"];
T.ru.tabs = ["Экран", "Пауза", "Фокус", "Защита"];
T.en.tabs = ["Home", "Pause", "Focus", "Guard"];

/* ---- The phone's screens. One set of templates serves the walkthrough and the stills. ---- */
const SCREENS = {
  home:
    '<div class="sc home"><div class="clock">9:41</div><div class="date" data-t="m_date"></div><div class="today" data-t="m_today"></div>' +
    '<ul class="apps"><li data-t="m_a1"></li><li data-t="m_a2"></li><li data-t="m_a3"></li><li data-t="m_a4"></li>' +
    '<li class="tapme">Instagram<span class="dot"></span></li><li>YouTube</li></ul></div>',
  wait:
    '<div class="sc wait"><b data-t="m_open"></b><div class="bar"><i></i></div><div class="dim" data-t="m_wait"></div><div class="dim" data-t="m_used"></div>' +
    '<div class="why" data-t="m_why"></div><div class="btns"><span class="main"><span data-t="m_home"></span><span class="dot"></span></span>' +
    '<span data-t="m_c5"></span><span data-t="m_c10"></span></div></div>',
  focus:
    '<div class="sc focus"><span class="tag" data-t="m_focus"></span><div class="clock">9:41</div><div class="date" data-t="m_date"></div>' +
    '<ul class="apps"><li data-t="m_f1"></li><li data-t="m_f2"></li><li data-t="m_f3"></li><li class="off">Instagram</li><li class="off">YouTube</li></ul></div>',
  guard:
    '<div class="sc guard"><div class="chat-top"><i></i>Telegram</div><div class="chat"><i></i><i></i><i></i><i></i></div><div class="toast" data-t="m_toast"></div></div>'
};

/* ---- The walkthrough: the phone shows itself, nobody has to work out what to press. ---- */
const Player = (() => {
  const order = ["home", "wait", "focus", "guard"];
  const caps = ["r1_h", "r2_h", "r3_h", "can2_h"];
  const dur = [5200, 5600, 4600, 5200];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let root, scs, tabs, i = 0, timer = 0, sub = 0, seen = true;

  function label() {
    document.getElementById("p-cap").textContent = T[LANG][caps[i]];
    tabs.forEach((b, j) => { b.lastChild.textContent = T[LANG].tabs[j]; });
  }
  function show(n, byHand) {
    i = n;
    clearTimeout(timer); clearTimeout(sub);
    root.classList.remove("tap");
    root.style.setProperty("--d", dur[n] + "ms");
    scs.forEach((el, j) => el.classList.toggle("on", j === n));
    tabs.forEach((b, j) => { b.setAttribute("aria-selected", String(j === n)); b.classList.remove("run"); });
    label();
    if (still || !seen) { if (n !== 0) root.classList.add("tap"); return; }
    void root.offsetWidth;
    tabs[n].classList.add("run");
    sub = setTimeout(() => root.classList.add("tap"), dur[n] * .58);
    timer = setTimeout(() => show((n + 1) % order.length), dur[n]);
  }
  function init() {
    root = document.getElementById("player");
    root.classList.toggle("auto", !still);
    document.getElementById("p-screen").innerHTML = order.map(k => SCREENS[k]).join("");
    scs = [...root.querySelectorAll(".sc")];
    document.getElementById("p-segs").innerHTML = order.map((_, j) => '<button type="button" role="tab" data-seg="' + j + '"><i></i><span></span></button>').join("");
    tabs = [...root.querySelectorAll("[data-seg]")];
    tabs.forEach(b => b.addEventListener("click", () => show(Number(b.dataset.seg), true)));
    // The stills further down the page.
    document.querySelectorAll("[data-shot]").forEach(el => { el.innerHTML = SCREENS[el.dataset.shot]; el.classList.add("still"); });
    if ("IntersectionObserver" in window && !still) {
      new IntersectionObserver(es => {
        const now = es[0].isIntersecting;
        if (now === seen) return;
        seen = now;
        show(i);
      }, { threshold: .2 }).observe(root);
    }
  }
  return { init, show, label };
})();

/* ---- The lists that repeat: built once, filled by the same data-t pass as the rest. ---- */
function build() {
  const ok = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.2 9.5"/></svg>';
  const no = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/></svg>';
  const item = (k, icon) => "<li>" + icon + '<div><h4 data-t="' + k + '_h"></h4><p data-t="' + k + '_p"></p></div></li>';
  document.getElementById("can").innerHTML = [1, 2, 3, 4].map(n => item("can" + n, ok)).join("");
  document.getElementById("cant").innerHTML = [1, 2, 3, 4].map(n => item("cant" + n, no)).join("");

  const free = ["v_yes", "v_two", "v_one", "v_7d", "v_yes", "", "", "", ""];
  const pro = ["v_yes", "v_unl", "v_unl", "v_8w", "v_yes", "v_yes", "v_yes", "v_yes", "v_yes"];
  const cell = k => k ? '<span data-t="' + k + '"></span>' : "<span>—</span>";
  document.getElementById("table").innerHTML =
    '<div class="tr th"><span data-t="t_what"></span><span data-t="t_free"></span><span>Pro</span></div>' +
    free.map((f, n) => '<div class="tr"><span data-t="t' + (n + 1) + '"></span>' + cell(f) + cell(pro[n]) + "</div>").join("");

  document.getElementById("faq-list").innerHTML = [1, 2, 3, 4, 5, 6].map(n =>
    '<details><summary data-t="q' + n + '"></summary><p data-t="a' + n + '"></p></details>').join("");
}

function pickLang() {
  try { const saved = localStorage.getItem("quiet-lang"); if (saved && T[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "uz").slice(0, 2).toLowerCase();
  return T[nav] ? nav : "uz";
}

function apply(lang) {
  const t = T[lang];
  LANG = lang;
  document.documentElement.lang = lang;
  document.title = t.title;
  // The policy in the same language as the page.
  const policy = "https://encrypster.github.io/quiet-privacy/" + (lang === "en" ? "" : lang + "/");
  document.getElementById("privacy-link").href = policy;
  document.getElementById("privacy-link-foot").href = policy;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("quiet-lang", lang); } catch (e) {}
  Player.label();
}

/* ---- Light or dark: the system's choice until the visitor makes their own. ---- */
function theme(set) {
  const root = document.documentElement;
  if (set) { root.dataset.theme = set; try { localStorage.setItem("quiet-theme", set); } catch (e) {} }
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0b0b0c" : "#ffffff";
  return dark;
}
try { const saved = localStorage.getItem("quiet-theme"); if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved; } catch (e) {}
theme();
document.getElementById("theme").addEventListener("click", () => theme(theme() ? "light" : "dark"));

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => apply(b.dataset.lang)));
build();
Player.init();
apply(pickLang());
Player.show(0);
</script>
